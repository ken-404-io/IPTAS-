services:
  - type: web
    name: iptas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOCKIFY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMPANY_NAME
        value: Northern Goods Co.
      - key: STOREFRONT_URL
        value: https://www.shopify.com
      - key: TIMEZONE
        value: America/Toronto
      - key: FX_USD_TO_CAD
        value: "1.37"
